<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도구 & 놀거리 모음</title>
<meta name="description" content="무료 온라인 도구(이미지·PDF·계산기)와 미니게임·테스트·운세 모음. 설치·회원가입 없이 브라우저에서 바로.">
<link rel="canonical" href="https://seam0814.github.io/">
<style>
  :root{--bg:#f6f7fb;--card:#fff;--fg:#1c2430;--muted:#6b7280;--border:#e5e8ef;--accent:#3b6fff}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#eef1f6;--muted:#9aa3b2;--border:#262c38}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:40px 18px 64px}
  h1{font-size:1.7rem;margin:.2em 0}
  p.sub{color:var(--muted);margin:.3em 0 1.6em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  a.card{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.card b{display:block;font-size:1.05rem;margin-bottom:3px}
  a.card small{color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>도구 &amp; 놀거리 모음</h1>
  <p class="sub">무료 온라인 도구와 미니게임·테스트·운세. 설치·회원가입 없이 바로 쓰세요.</p>
  <div class="grid">
    <a class="card" href="/img-compress/"><b>🧰 무료 도구 모음</b><small>이미지 압축·리사이즈·변환, PDF, 글자수, 만나이, QR 등 10종</small></a>
    <a class="card" href="/simsim/"><b>🎮 심심풀이 게임</b><small>반응속도·지뢰찾기·오목 등 미니게임 모음</small></a>
    <a class="card" href="/unse/"><b>🌙 달빛운세</b><small>사주팔자·오늘의 운세·궁합</small></a>
    <a class="card" href="/typetest/"><b>🐶 테스트집</b><small>동물상 등 심리·성향 테스트</small></a>
    <a class="card" href="/wordplay/"><b>🗣️ 온라인 끝말잇기</b><small>친구와 2인 대전</small></a>
    <a class="card" href="/sheetgame/"><b>🔢 엑셀 2048</b><small>업무 위장 퍼즐 게임</small></a>
  </div>
  <footer>© 2026 · 모든 도구는 브라우저에서 동작하며 파일은 서버로 전송되지 않습니다.</footer>
</div>
</body>
</html>
